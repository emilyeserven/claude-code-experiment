name: Setup Environment
description: Checkout, install pnpm, Node.js, configure registry, and install dependencies

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "22"
  ref:
    description: Git ref to checkout
    required: false
    default: ""
  gh-packages-token:
    description: Token for GitHub Packages registry
    required: true

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"

    - name: Configure npm registry for private packages
      shell: bash
      run: |
        echo "@emilyeserven:registry=https://npm.pkg.github.com" >> .npmrc
        echo "//npm.pkg.github.com/:_authToken=${{ inputs.gh-packages-token }}" >> .npmrc

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
